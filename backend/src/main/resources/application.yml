server:
  port: 8081
  servlet:
    context-path: /

spring:
  config:
    import: "optional:file:./application-local.yml,optional:file:./backend/application-local.yml"
  application:
    name: zilvzi-backend

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/zilvzi?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000

  # Redis配置
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  banner:
    location: classpath:banner.txt

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zilvzi.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# PageHelper配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT配置
jwt:
  secret: "${JWT_SECRET}"
  expiration: 604800000

# 文件上传路径
upload:
  path: "${UPLOAD_PATH:./uploads}"
  url: "${UPLOAD_URL:http://localhost:8081/uploads}"

# AI配置 (DeepSeek)
ai:
  api:
    url: "${AI_API_URL:https://api.deepseek.com/chat/completions}"
    key: "${AI_API_KEY:}"
  model: "${AI_MODEL:deepseek-chat}"

# 微信小程序配置
wechat:
  appid: "${WECHAT_APP_ID:}"
  secret: "${WECHAT_SECRET:}"

# 验证码投递桥接服务：仅接受 HTTPS，未配置时验证码登录返回明确失败。
verification:
  delivery:
    url: "${VERIFICATION_DELIVERY_URL:}"
    token: "${VERIFICATION_DELIVERY_TOKEN:}"

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: "${ALIYUN_OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}"
    access-key-id: "${ALIYUN_OSS_ACCESS_KEY_ID:}"
    access-key-secret: "${ALIYUN_OSS_ACCESS_KEY_SECRET:}"
    bucket-name: "${ALIYUN_OSS_BUCKET_NAME:}"
    url-prefix: "${ALIYUN_OSS_URL_PREFIX:}"
  ocr:
    access-key-id: "${ALIYUN_OCR_ACCESS_KEY_ID:}"
    access-key-secret: "${ALIYUN_OCR_ACCESS_KEY_SECRET:}"

# 日志配置
logging:
  level:
    com.zilvzi.mapper: debug
    org.springframework: warn


# No administrator is created unless a bootstrap password is configured.
admin:
  bootstrap:
    username: "${ADMIN_BOOTSTRAP_USERNAME:admin}"
    password: "${ADMIN_BOOTSTRAP_PASSWORD:}"

vip:
  plan:
    duration-days: ${VIP_PLAN_DURATION_DAYS:30}
    price-fen: ${VIP_PLAN_PRICE_FEN:990}
  payment:
    channel: "${VIP_PAYMENT_CHANNEL:disabled}"
  mock-payment:
    enabled: ${VIP_MOCK_PAYMENT_ENABLED:false}
