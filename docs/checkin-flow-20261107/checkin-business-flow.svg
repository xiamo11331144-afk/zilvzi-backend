<text x="1730" y="1327" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">新建记录：status = pending；保存凭证字段</text>
<text x="1730" y="1365" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">通知匹配搭子，并写入打卡凭证私信</text>
<polyline points="1730,1390 1730,1435" fill="none" stroke="#97631f" stroke-width="3"/><polygon points="1730,1435 1724.1587248653702,1421.1840850899566 1735.8412751346298,1421.1840850899566" fill="#97631f"/>
<rect x="1305.0" y="1435" width="850" height="120" rx="16" fill="#fff8e9" stroke="#97631f" stroke-width="2"/>
<text x="1730" y="1482.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">返回 pending，提交请求结束；等待另一请求</text>
<text x="1730" y="1520.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">此时不更新目标打卡统计、不加经验</text>
<polyline points="1730,1555 1730,1600" fill="none" stroke="#97631f" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1730,1600 1724.1587248653702,1586.1840850899566 1735.8412751346298,1586.1840850899566" fill="#97631f"/>
<text x="1880" y="1590" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#97631f">异步人工审核</text>
<rect x="1305.0" y="1600" width="850" height="120" rx="16" fill="#f0f5fa" stroke="#9ab0c4" stroke-width="2"/>
<text x="1730" y="1647.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">搭子查看待审列表或凭证私信后提交结果</text>
<text x="1730" y="1685.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">POST /api/checkin/review · approved / comment</text>
<polyline points="1730,1720 1730,1760" fill="none" stroke="#326b92" stroke-width="3"/><polygon points="1730,1760 1724.1587248653702,1746.1840850899566 1735.8412751346298,1746.1840850899566" fill="#326b92"/>
<polygon points="1730,1760 2165.0,1845.0 1730,1930 1295.0,1845.0" fill="#fff8e9" stroke="#b79551" stroke-width="2"/>
<text x="1730" y="1833.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">记录存在、仍 pending，且审核校验通过？</text>
<text x="1730" y="1870.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">权限检查存在局限，详见核对说明</text>
<rect x="230.0" y="1780" width="760" height="120" rx="16" fill="#fff0ee" stroke="#a74442" stroke-width="2"/>
<text x="610" y="1827.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">返回错误，当前审核请求不改变记录状态</text>
<text x="610" y="1865.0" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">例如：记录不存在、已审核、未通过权限检查</text>
<polyline points="1295,1845 990,1845" fill="none" stroke="#a74442" stroke-width="3"/><polygon points="990,1845 1003.8159149100433,1839.1587248653702 1003.8159149100433,1850.8412751346298" fill="#a74442"/>
<text x="1150" y="1830" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#a74442">否</text>
<polyline points="1730,1930 1730,1970" fill="none" stroke="#326b92" stroke-width="3"/><polygon points="1730,1970 1724.1587248653702,1956.1840850899566 1735.8412751346298,1956.1840850899566" fill="#326b92"/>
<text x="1780" y="1961" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#326b92">是</text>
<polygon points="1730,1970 2030.0,2030.0 1730,2090 1430.0,2030.0" fill="#fff8e9" stroke="#b79551" stroke-width="2"/>
<text x="1730" y="2036.5" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">approved 为 true？</text>
<polyline points="1430,2030 1070,2030 1070,2150" fill="none" stroke="#27694e" stroke-width="3"/><polygon points="1070,2150 1064.1587248653702,2136.1840850899566 1075.8412751346298,2136.1840850899566" fill="#27694e"/>
<text x="1245" y="2013" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#27694e">是：通过</text>
<polyline points="2030,2030 2030,2150" fill="none" stroke="#a74442" stroke-width="3"/><polygon points="2030,2150 2024.1587248653702,2136.1840850899566 2035.8412751346298,2136.1840850899566" fill="#a74442"/>
<text x="2130" y="2083" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#a74442">否：驳回</text>
<rect x="670.0" y="2150" width="800" height="205" rx="16" fill="#eef8f2" stroke="#27694e" stroke-width="2"/>
<text x="1070" y="2194" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#27694e">③ 审核通过</text>
<text x="1070" y="2237" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">status = approved；记录审核人 / 时间 / 评语</text>
<text x="1070" y="2275" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">尝试更新凭证私信；重算目标打卡统计</text>
<text x="1070" y="2313" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">检查成就、增加 10 经验并通知提交者</text>
<text x="1070" y="2351" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">返回 approved；审核请求结束</text>
<rect x="1675.0" y="2150" width="570" height="205" rx="16" fill="#fff0ee" stroke="#a74442" stroke-width="2"/>
<text x="1960" y="2194" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#a74442">④ 审核驳回</text>
<text x="1960" y="2237" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">status = rejected；记录审核信息</text>
<text x="1960" y="2275" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">尝试更新凭证私信并通知提交者</text>
<text x="1960" y="2313" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">不加经验，不计 approved 天数</text>
<text x="1960" y="2351" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">返回 rejected；审核请求结束</text>
<rect x="85.0" y="2410" width="2110" height="220" rx="16" fill="#f7f8fa" stroke="#708396" stroke-width="2"/>
<text x="1140" y="2453" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#19334a">实现边界（是现有行为，不能按理想流程补画）</text>
<text x="1140" y="2493" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#19334a">待审核及驳回时，关联任务仍可能 completed = 1；驳回不会自动回滚任务，也没有完整的修改重提闭环。</text>
<text x="1140" y="2529" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#19334a">普通打卡与审核通过都写 approved；“普通”不是第四种数据库状态。日历日期查询未过滤审核状态。</text>
<text x="1140" y="2565" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#19334a">审核 SQL 未以 pending 为更新条件，也未做原子抢占；不能据此宣称并发审核“先到先得”已保证。</text>
<text x="1140" y="2601" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#19334a">仅为当前源码流程核对；未进行真实接口、数据库或微信端运行验收。实线为本次请求，虚线为跨请求等待。</text>
</svg>