<text x="1630" y="1081" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#97631f">是</text>
<rect x="120.0" y="1240" width="780" height="150" rx="16" fill="#eef8f2" stroke="#27694e" stroke-width="2"/>
<text x="510" y="1284" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#27694e">① 普通打卡</text>
<text x="510" y="1327" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">新建记录：status = approved</text>
<text x="510" y="1365" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#19334a">普通打卡直接生效，无需搭子审核</text>
<polyline points="510,1390 510,1440" fill="none" stroke="#27694e" stroke-width="3"/><polygon points="510,1440 504.15872486537023,1426.1840850899566 515.8412751346298,1426.1840850899566" fill="#27694e"/>
